<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="theme-color" content="#ff8b2d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>FrisQueendom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-title: "Bebas Neue", "Impact", "Haettenschweiler", sans-serif;
            --font-body: "Barlow Condensed", "Avenir Next Condensed", "Trebuchet MS", sans-serif;
            --font-mono: "Space Mono", "Consolas", monospace;
            --bg-base: #040b17;
            --bg-panel: rgba(7, 19, 37, 0.9);
            --bg-panel-soft: rgba(11, 32, 60, 0.74);
            --bg-card: rgba(6, 20, 40, 0.66);
            --line-soft: rgba(154, 195, 242, 0.2);
            --line-strong: rgba(154, 195, 242, 0.34);
            --text-main: #f1f8ff;
            --text-dim: #8ea5c0;
            --accent-gold: #ffd166;
            --accent-cyan: #33d6ff;
            --accent-blue: #2f84ff;
            --accent-orange: #ff8b2d;
            --accent-red: #ff4d6d;
            --shadow-strong: 0 26px 80px rgba(0, 0, 0, 0.5);
            --shadow-soft: 0 12px 28px rgba(0, 0, 0, 0.3);
            --radius-lg: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body);
            background:
                radial-gradient(1100px 620px at 22% -6%, rgba(39, 134, 219, 0.44), transparent 60%),
                radial-gradient(980px 540px at 96% -8%, rgba(255, 115, 37, 0.32), transparent 62%),
                radial-gradient(1200px 880px at 52% 115%, rgba(48, 190, 140, 0.17), transparent 56%),
                var(--bg-base);
            color: var(--text-main);
            letter-spacing: 0.02em;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(640px 320px at 11% -7%, rgba(51, 214, 255, 0.2), transparent 72%),
                radial-gradient(780px 430px at 90% -10%, rgba(255, 122, 34, 0.2), transparent 74%),
                linear-gradient(125deg, rgba(255, 255, 255, 0.032) 1px, transparent 1px);
            background-size: auto, auto, 28px 28px;
            mix-blend-mode: screen;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(700px 420px at 50% 15%, rgba(0, 0, 0, 0.2), transparent 66%);
            z-index: 0;
        }

        canvas {
            display: block;
            position: relative;
            z-index: 1;
        }
        
        #ui {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        #ui > * {
            pointer-events: auto;
        }

        #menu-container {
            position: fixed;
            inset: 0;
            z-index: 1000;
        }

        .menu-container {
            --menu-ui-scale: 1.3;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(8px, 1.4vw, 18px);
            background:
                linear-gradient(to bottom, rgba(255, 255, 255, 0.025), transparent 18%, transparent 82%, rgba(255, 255, 255, 0.018)),
                radial-gradient(ellipse at 18% 10%, rgba(51, 214, 255, 0.2), transparent 55%),
                radial-gradient(ellipse at 82% 16%, rgba(255, 122, 34, 0.2), transparent 55%),
                radial-gradient(ellipse at 52% 112%, rgba(84, 206, 90, 0.16), transparent 60%),
                linear-gradient(164deg, rgba(5, 16, 31, 0.92) 0%, rgba(4, 12, 24, 0.96) 100%);
            overflow: auto;
        }

        .title-screen,
        .main-menu,
        .career-menu,
        .match-setup,
        .settings-menu,
        .credits,
        .practice-menu,
        .locker-menu {
            position: relative;
            z-index: 2;
            animation: panelIn 460ms cubic-bezier(.2, .9, .2, 1);
        }
        
        .title-screen {
            width: min(1760px, 99vw);
            min-height: clamp(620px, 84vh, 900px);
            border-radius: 38px;
            border: 1px solid rgba(143, 200, 255, 0.26);
            background:
                linear-gradient(142deg, rgba(9, 33, 58, 0.86), rgba(4, 14, 28, 0.95) 55%, rgba(6, 18, 34, 0.97) 100%);
            box-shadow: var(--shadow-strong);
            padding: clamp(28px, 3.2vw, 52px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: clamp(20px, 2.5vw, 34px);
            overflow: hidden;
        }

        .title-screen::before {
            content: "";
            position: absolute;
            inset: -24% 48% auto -14%;
            height: clamp(190px, 34vh, 350px);
            background: radial-gradient(closest-side, rgba(64, 191, 255, 0.34), transparent 72%);
            pointer-events: none;
        }

        .title-screen::after {
            content: "";
            position: absolute;
            inset: auto -12% -28% 42%;
            height: clamp(220px, 30vh, 340px);
            background: radial-gradient(closest-side, rgba(255, 122, 34, 0.3), transparent 72%);
            pointer-events: none;
        }

        .title-eyebrow {
            position: relative;
            z-index: 2;
            display: inline-block;
            border: 1px solid rgba(255, 209, 102, 0.62);
            border-radius: 999px;
            padding: 7px 16px;
            color: var(--accent-gold);
            font-size: 0.82rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            background: rgba(255, 209, 102, 0.08);
            box-shadow: 0 0 26px rgba(255, 209, 102, 0.2);
            align-self: flex-start;
        }

        .title-layout {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(0, 1.16fr) minmax(560px, 1.24fr);
            align-items: stretch;
            gap: clamp(28px, 2.6vw, 52px);
            flex: 1;
            min-height: 0;
        }

        .title-hero {
            display: grid;
            align-content: start;
            gap: clamp(14px, 1.5vw, 20px);
            min-width: 0;
            padding-right: clamp(0px, 2vw, 26px);
        }
        
        .game-title {
            position: relative;
            font-family: var(--font-title);
            font-size: clamp(4.4rem, 10.6vw, 10.7rem);
            line-height: 0.78;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin: 0;
            width: max-content;
            max-width: 100%;
            min-height: clamp(260px, 28vw, 360px);
            padding-bottom: clamp(2px, 0.6vw, 10px);
            isolation: isolate;
        }

        .game-title .title-word {
            position: relative;
            z-index: 3;
            display: block;
            width: max-content;
            line-height: 0.86;
            background: linear-gradient(20deg, #fff8e4 8%, #ffd166 38%, #ff7a22 72%, #ff4d6d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow:
                0 0 22px rgba(255, 122, 34, 0.22),
                0 0 52px rgba(255, 122, 34, 0.32);
        }

        .game-title .title-word-dom {
            margin-top: clamp(70px, 5.1vw, 108px);
            letter-spacing: 0.046em;
        }

        .game-title .title-disc {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            left: 50%;
            top: 50%;
            width: clamp(320px, 24.7vw, 437px);
            aspect-ratio: 1;
            display: block;
            transform: translate(-50%, -50%) rotate(-15deg) skewX(-15deg) scaleY(0.72);
            transform-origin: center;
        }

        .game-title .title-disc img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter:
                drop-shadow(0 0 10px rgba(143, 220, 255, 0.26))
                drop-shadow(0 22px 28px rgba(0, 0, 0, 0.34));
        }
        
        .game-subtitle {
            max-width: 900px;
            font-size: clamp(1rem, 1.55vw, 1.34rem);
            color: var(--text-dim);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            line-height: 1.28;
        }

        .title-features {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-top: 8px;
            width: min(920px, 100%);
        }

        .title-features span {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 13px;
            border-radius: 12px;
            border: 1px solid rgba(154, 195, 242, 0.3);
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            color: #d6eaff;
            font-size: 0.76rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            white-space: normal;
            line-height: 1.12;
        }

        .title-features span b {
            font-family: var(--font-mono);
            color: var(--accent-gold);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
        }

        .title-command-deck {
            width: min(940px, 100%);
            margin-top: 6px;
            display: grid;
            gap: 12px;
        }

        .title-player-card {
            padding: 12px 14px 14px;
            gap: 11px;
            border-radius: 14px;
            border-color: rgba(129, 180, 233, 0.25);
            background: linear-gradient(152deg, rgba(6, 20, 40, 0.7), rgba(5, 16, 31, 0.5));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .title-player-card .profile-header {
            gap: 11px;
        }

        .title-player-card .profile-level {
            width: 52px;
            height: 52px;
            font-size: 1.45rem;
        }

        .title-player-card .profile-label {
            margin-bottom: 4px;
            letter-spacing: 0.16em;
        }

        .title-player-card .profile-xp-bar {
            height: 8px;
            margin-bottom: 5px;
        }

        .title-player-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(166, 202, 235, 0.82);
        }

        .title-player-card .profile-challenges {
            gap: 5px;
        }

        .title-player-card .menu-challenge-item {
            padding: 5px 8px;
            font-size: 0.76rem;
            background: rgba(255, 255, 255, 0.03);
        }

        .title-menu-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .title-menu-grid .menu-btn {
            min-height: 42px;
            padding: 0.58rem 0.72rem;
            border-radius: 10px;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            font-weight: 600;
            color: rgba(197, 220, 242, 0.86);
            border-color: rgba(147, 191, 233, 0.25);
            background: linear-gradient(152deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            box-shadow: none;
        }

        .title-menu-grid .menu-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(164, 211, 255, 0.56);
            background: linear-gradient(152deg, rgba(143, 220, 255, 0.16), rgba(255, 255, 255, 0.05));
            box-shadow: none;
        }

        .lobby-container {
            position: relative;
            border: 1px solid rgba(143, 220, 255, 0.44);
            border-radius: 18px;
            padding: clamp(16px, 1.8vw, 22px);
            background: linear-gradient(154deg, rgba(4, 14, 30, 0.9), rgba(5, 16, 30, 0.96));
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.09),
                0 18px 38px rgba(0, 0, 0, 0.34),
                0 0 46px rgba(51, 214, 255, 0.12);
            min-height: clamp(520px, 72vh, 760px);
            height: 100%;
            align-self: stretch;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .lobby-container::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(143, 220, 255, 0.14);
            border-radius: 12px;
            pointer-events: none;
        }

        .lobby-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .lobby-header h2 {
            font-family: var(--font-body);
            font-size: 0.88rem;
            letter-spacing: 0.18em;
            color: #93dfff;
            text-transform: uppercase;
            font-weight: 600;
        }

        .featured-preview {
            min-height: clamp(290px, 49vh, 500px);
            border-radius: 14px;
            border: 1px solid rgba(95, 189, 255, 0.38);
            background:
                linear-gradient(162deg, rgba(3, 11, 24, 0.9), rgba(2, 8, 18, 0.96)),
                radial-gradient(360px 160px at 50% 0%, rgba(60, 157, 230, 0.22), transparent 72%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 34px rgba(0, 0, 0, 0.36);
        }

        .preview-label {
            position: absolute;
            top: 10px;
            left: 11px;
            border-radius: 999px;
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 4px 8px;
            color: #ffd877;
            border: 1px solid rgba(255, 209, 102, 0.46);
            background: rgba(255, 209, 102, 0.15);
        }

        .preview-content {
            width: 100%;
            padding: 20px 16px 14px;
            text-align: center;
            display: grid;
            place-items: center;
            gap: 8px;
        }

        .preview-placeholder,
        .list-placeholder {
            color: rgba(232, 244, 255, 0.75);
            font-size: 0.95rem;
            letter-spacing: 0.04em;
        }

        .preview-score-board {
            display: grid;
            width: 100%;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: clamp(10px, 2vw, 24px);
        }

        .preview-team {
            display: grid;
            gap: 2px;
            justify-items: center;
        }

        .preview-team-name {
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #ecf6ff;
        }

        .preview-score {
            font-family: var(--font-mono);
            font-size: clamp(1.55rem, 3.5vw, 2rem);
            color: #fff;
        }

        .preview-vs {
            font-family: var(--font-title);
            font-size: 1.45rem;
            color: rgba(255, 255, 255, 0.24);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .preview-meta {
            margin-top: 1px;
            font-size: 0.67rem;
            color: #8fdcff;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .room-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 0 0 auto;
            max-height: 180px;
            min-height: 84px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.11);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: transform .16s ease, border-color .16s ease, background .16s ease;
        }

        .room-item:hover {
            transform: translateY(-1px);
            background: rgba(51, 214, 255, 0.11);
            border-color: rgba(143, 220, 255, 0.44);
        }

        .room-info {
            min-width: 0;
            display: grid;
            gap: 3px;
        }

        .room-teams {
            font-size: 0.9rem;
            color: #f0f7ff;
            font-weight: 600;
            line-height: 1.2;
        }

        .room-meta {
            font-size: 0.7rem;
            color: rgba(215, 230, 247, 0.67);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .room-action {
            font-size: 0.68rem;
            color: #7fd8ff;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            white-space: nowrap;
        }

        .title-footer {
            position: relative;
            z-index: 2;
            display: grid;
            gap: 10px;
            margin-top: auto;
        }

        .title-actions {
            display: grid;
            grid-template-columns: 1.1fr 1.1fr 0.74fr;
            gap: 14px;
            align-items: center;
            padding: 14px;
            border: 1px solid rgba(154, 195, 242, 0.26);
            border-radius: 18px;
            background: linear-gradient(150deg, rgba(8, 24, 43, 0.72), rgba(6, 17, 34, 0.6));
        }

        .title-actions .menu-btn:not(.primary) {
            color: #d7e7fb;
            border-color: rgba(154, 195, 242, 0.34);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            box-shadow: none;
        }
        
        .version {
            position: relative;
            z-index: 2;
            justify-self: end;
            color: rgba(167, 188, 216, 0.72);
            font-size: 0.74rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin: 0 4px 0 0;
        }
        
        .main-menu,
        .career-menu,
        .match-setup,
        .settings-menu,
        .credits,
        .practice-menu,
        .locker-menu {
            width: min(880px, 94vw);
            max-height: 90vh;
            overflow-y: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--line-soft);
            background:
                linear-gradient(155deg, var(--bg-panel) 0%, var(--bg-panel-soft) 100%);
            box-shadow: var(--shadow-strong);
            padding: clamp(22px, 4vw, 40px);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        
        .main-menu h1,
        .career-menu h1,
        .match-setup h1,
        .settings-menu h1,
        .credits h1,
        .practice-menu h1,
        .locker-menu h1 {
            text-align: center;
            font-family: var(--font-title);
            letter-spacing: 0.08em;
            font-size: clamp(2rem, 4vw, 3rem);
            color: #ffe2a8;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .menu-subtitle {
            text-align: center;
            color: var(--text-dim);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 0.35rem;
        }
        
        .menu-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 0.75rem;
            width: 100%;
        }

        .menu-grid-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        
        .menu-btn {
            position: relative;
            overflow: hidden;
            padding: 0.9rem 1.15rem;
            font-size: 0.95rem;
            font-family: var(--font-body);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            color: var(--text-main);
            cursor: pointer;
            transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
            font-weight: 600;
            min-height: 52px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
        }

        .menu-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-120%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.28), transparent);
            transition: transform .45s ease;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 209, 102, 0.65);
            background: rgba(255, 209, 102, 0.16);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .menu-btn:hover::before {
            transform: translateX(120%);
        }
        
        .menu-btn.primary {
            border-color: rgba(255, 122, 34, 0.8);
            background: linear-gradient(150deg, rgba(255, 129, 31, 0.96), rgba(255, 77, 109, 0.94));
            color: #fff9ee;
            box-shadow: 0 12px 28px rgba(255, 116, 45, 0.3);
        }
        
        .menu-btn.primary:hover {
            border-color: rgba(255, 209, 102, 0.95);
            background: linear-gradient(150deg, rgba(255, 153, 49, 0.97), rgba(255, 97, 123, 0.95));
        }
        
        .menu-btn.danger {
            border-color: rgba(255, 77, 109, 0.72);
            background: rgba(255, 77, 109, 0.18);
        }
        
        .menu-btn.danger:hover {
            border-color: rgba(255, 120, 148, 0.95);
            background: rgba(255, 77, 109, 0.34);
        }

        .menu-btn.small {
            min-height: 38px;
            padding: 0.52rem 0.75rem;
            border-radius: 10px;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
        }

        /* Layout-safe UI scaling (text/control sizing without panel clipping) */
        .menu-container .main-menu h1,
        .menu-container .career-menu h1,
        .menu-container .match-setup h1,
        .menu-container .settings-menu h1,
        .menu-container .credits h1,
        .menu-container .practice-menu h1,
        .menu-container .locker-menu h1 {
            font-size: clamp(
                calc(2rem * var(--menu-ui-scale, 1)),
                calc(4vw * var(--menu-ui-scale, 1)),
                calc(3rem * var(--menu-ui-scale, 1))
            );
        }

        .menu-container .menu-subtitle {
            font-size: calc(0.9rem * var(--menu-ui-scale, 1));
        }

        .menu-container .menu-btn {
            min-height: calc(52px * var(--menu-ui-scale, 1));
            padding: calc(0.9rem * var(--menu-ui-scale, 1)) calc(1.15rem * var(--menu-ui-scale, 1));
            font-size: calc(0.95rem * var(--menu-ui-scale, 1));
            border-radius: calc(13px * var(--menu-ui-scale, 1));
        }

        .menu-container .menu-btn.small {
