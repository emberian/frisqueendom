<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>FrisQueendom Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #040911;
            --panel: rgba(12, 22, 42, 0.82);
            --line: rgba(255, 255, 255, 0.12);
            --text: #e8f1ff;
            --muted: #8298b0;
            --accent: #ffd166;
            --accent-glow: rgba(255, 209, 102, 0.3);
            --safe-area-bottom: env(safe-area-inset-bottom, 16px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            min-height: 100vh;
            background: 
                radial-gradient(circle at 0% 0%, rgba(51, 214, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(255, 77, 109, 0.1) 0%, transparent 40%),
                var(--bg);
            color: var(--text);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: fixed;
            inset: 0;
        }

        .header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--line);
        }
        h1 {
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #8298b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #status {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            font-weight: 600;
        }
        #status.connected { color: #4ade80; }

        .connection-panel {
            padding: 16px 20px;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
        }
        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
        }
        button#connect {
            padding: 0 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 209, 102, 0.4);
            background: linear-gradient(150deg, rgba(255, 122, 34, 0.9), rgba(255, 77, 109, 0.9));
            color: white;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .main-controls {
            flex: 1;
            display: flex;
            padding: 20px;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .stick-container {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05), transparent);
            border: 2px solid var(--line);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            touch-action: none;
        }
        .stick-container h2 {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 0.1em;
        }
        #move-knob, #aim-reticle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
        }
        #move-knob {
            background: linear-gradient(135deg, #ffd166, #ff7a22);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        #aim-reticle {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #33d6ff, #6084ff);
            box-shadow: 0 0 15px rgba(51, 214, 255, 0.3);
        }

        .action-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 500px;
        }

        .btn {
            aspect-ratio: 1;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn:active, .btn.active {
            transform: scale(0.92);
            border-color: var(--accent);
            background: rgba(255, 209, 102, 0.15);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn.primary {
            background: linear-gradient(150deg, rgba(255, 122, 34, 0.15), rgba(255, 77, 109, 0.15));
            border-color: rgba(255, 122, 34, 0.4);
        }
        .btn.primary:active, .btn.primary.active {
            background: linear-gradient(150deg, rgba(255, 122, 34, 0.6), rgba(255, 77, 109, 0.6));
            border-color: #ffd166;
        }
        .btn.span-2 { grid-column: span 2; aspect-ratio: auto; min-height: 54px; }

        .footer {
            padding: 10px 20px calc(var(--safe-area-bottom) + 10px);
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--muted);
        }

        @media (orientation: portrait) {
            .main-controls {
                flex-direction: column;
                justify-content: center;
                gap: 40px;
            }
            .action-grid {
                width: 100%;
                max-width: 320px;
            }
            .stick-container {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>FrisQueendom</h1>
        <div id="status">Ready</div>
    </div>

    <div class="connection-panel">
        <div style="display:flex; flex-direction:column; gap:8px; flex:1;">
            <input id="relay-url" type="text" placeholder="Relay URL" />
            <div style="display:flex; gap:8px;">
                <input id="room" type="text" placeholder="Room Code" style="flex:2;" />
                <input id="accent-color" type="color" value="#ffd166" style="flex:1; padding:0; height:42px; min-width:60px; border:none; background:transparent; cursor:pointer;" title="Player Accent Color" />
            </div>
        </div>
        <button id="connect" style="height:auto;">Connect</button>
    </div>

    <div id="browser-panel" style="padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px;">
        <h2 style="font-size: 0.8rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;">Public Games</h2>
        <div id="room-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 160px; overflow-y: auto;">
            <div style="font-size: 0.85rem; color: rgba(255,255,255,0.3); text-align: center; padding: 10px;">Searching for matches...</div>
        </div>
    </div>

    <div class="main-controls">
        <div id="move-pad" class="stick-container">
            <h2>Move</h2>
            <div id="move-knob"></div>
        </div>

        <div class="action-grid">
            <button class="btn primary span-2" data-hold="true" data-action="throw">Throw</button>
            <button class="btn primary span-2" data-hold="true" data-action="forehand">Forehand</button>
            
            <button class="btn" data-hold="true" data-action="sprint">Sprint</button>
            <button class="btn" data-hold="true" data-action="jump">Jump</button>
            <button class="btn" data-tap="true" data-action="switch">Switch</button>
            <button class="btn" data-hold="true" data-action="hammer">Hammer</button>
            
            <button class="btn" data-hold="true" data-action="blade">Blade</button>
            <button class="btn" data-hold="true" data-action="thumber">Thumber</button>
            <button class="btn" data-hold="true" data-action="high">High</button>
            <button class="btn" data-hold="true" data-action="low">Low</button>
            
            <button class="btn span-2" data-hold="true" data-action="curveLeft">Curve -</button>
            <button class="btn span-2" data-hold="true" data-action="curveRight">Curve +</button>
        </div>

        <div id="aim-pad" class="stick-container">
            <h2>Aim</h2>
            <div id="aim-reticle"></div>
        </div>
    </div>

    <div class="footer">
        <span>v0.1.0 Companion</span>
        <span>LAN Relay Mode</span>
    </div>

    <script type="module" src="/src/controller.ts"></script>
</body>
</html>
